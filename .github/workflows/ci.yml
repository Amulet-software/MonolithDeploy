name: MonolithDeploy CI

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n bootstrap.sh
          bash -n deploy.sh
          bash -n health-check.sh
          bash -n backup.sh
          bash -n cicd-preflight.sh
          bash -n deploy-key-setup.sh
          bash -n install-runner.sh
          bash -n deployment-status.sh

      - name: Validate DEV Compose
        run: |
          docker compose \
            --project-name monolith-dev-ci \
            --env-file profiles/dev.env.example \
            --profile dev \
            config --quiet
